# dsh-engram bundle: insert one plugin row (tools + approval seam consumer).
#
# dbPath persists by default under the harness home (~/.dsh/engram.db), so
# approved memories survive restarts. Override with ENGRAM_DB_PATH; unit tests
# construct the service with ':memory:' directly and never go through this patch.
- insert:
    - id: memory
      name: dsh-engram
      config:
        dbPath: !!js process.env.ENGRAM_DB_PATH ?? (process.env.HOME ?? '/root') + '/.dsh/engram.db'
