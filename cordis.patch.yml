# dsh-engram bundle: insert one plugin row (tools + approval seam consumer).
#
# All settings have schema defaults (see src/index.ts Config) and render in
# the web UI's plugin settings form; override any of them here per profile.
# The database defaults to ~/.dsh/engram.db (or ENGRAM_DB_PATH), so approved
# memories survive restarts. Unit tests construct the service with
# ':memory:' directly and never go through this patch.
- insert:
    - id: memory
      name: dsh-engram
